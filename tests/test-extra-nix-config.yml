name: Test Nix installation with extra nix config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          extra_nix_config: |
            sandbox = false
      - name: Assert Nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix binary not found in PATH"
            exit 1
          fi
          echo "nix found at: $(command -v nix)"
          echo "nix version: $(nix --version)"
          echo "PASS: Nix is installed"
      - name: Assert extra config was applied (sandbox = false)
        run: |
          echo "Checking nix.conf for sandbox setting..."
          if ! sudo grep -q "sandbox = false" /etc/nix/nix.conf; then
            echo "FAIL: 'sandbox = false' not found in /etc/nix/nix.conf"
            sudo cat /etc/nix/nix.conf || true
            exit 1
          fi
          echo "PASS: extra nix config was applied"
      - name: Assert experimental features are enabled
        run: |
          echo "Checking nix.conf for experimental-features..."
          if ! sudo grep -q "experimental-features" /etc/nix/nix.conf; then
            echo "FAIL: experimental-features not found in /etc/nix/nix.conf"
            sudo cat /etc/nix/nix.conf || true
            exit 1
          fi
          echo "PASS: experimental-features is configured"
