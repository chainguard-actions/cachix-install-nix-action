name: Test Nix installation with extra nix config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          extra_nix_config: |
            sandbox = false
      - name: Assert nix is installed
        run: |
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          echo "PASS: nix found at $(command -v nix)"
      - name: Assert nix config contains sandbox setting
        run: |
          echo "Checking /etc/nix/nix.conf for sandbox setting..."
          if [ -f /etc/nix/nix.conf ]; then
            cat /etc/nix/nix.conf
            if grep -q "sandbox = false" /etc/nix/nix.conf; then
              echo "PASS: sandbox = false found in /etc/nix/nix.conf"
            else
              echo "FAIL: sandbox = false not found in /etc/nix/nix.conf"
              exit 1
            fi
          else
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
      - name: Assert experimental-features is set (default)
        run: |
          echo "Checking /etc/nix/nix.conf for experimental-features..."
          if grep -q "experimental-features" /etc/nix/nix.conf; then
            echo "PASS: experimental-features found in nix.conf"
          else
            echo "FAIL: experimental-features not found in nix.conf"
            exit 1
          fi
