name: Test extra_nix_config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          extra_nix_config: |
            sandbox = false
            connect-timeout = 30
      - name: Assert nix is installed
        run: |
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          echo "PASS: nix is installed"
      - name: Assert extra nix config was applied
        run: |
          echo "Checking /etc/nix/nix.conf for extra config..."
          if [ ! -f /etc/nix/nix.conf ]; then
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
          cat /etc/nix/nix.conf
          if ! grep -q "sandbox = false" /etc/nix/nix.conf; then
            echo "FAIL: extra config 'sandbox = false' not found in /etc/nix/nix.conf"
            exit 1
          fi
          if ! grep -q "connect-timeout = 30" /etc/nix/nix.conf; then
            echo "FAIL: extra config 'connect-timeout = 30' not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: extra nix config is present in /etc/nix/nix.conf"
      - name: Assert default experimental-features are set
        run: |
          echo "Checking for experimental-features in /etc/nix/nix.conf..."
          if ! grep -q "experimental-features" /etc/nix/nix.conf; then
            echo "FAIL: experimental-features not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: experimental-features is set"
