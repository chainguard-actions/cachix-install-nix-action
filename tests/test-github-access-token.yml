name: Test custom github_access_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
      - id: action
        uses: .
        with:
          install_url: file://${{ github.workspace }}/tests/fixtures/fake-install.sh
          enable_kvm: false
          github_access_token: custom-test-token-123
      - name: Assert access token configured
        run: |
          CONF=/tmp/fake-nix-extra.conf
          if ! grep -qxF "access-tokens = github.com=custom-test-token-123" "$CONF"; then
            echo "FAIL: expected custom access-tokens line"
            grep -c '^access-tokens' "$CONF" || true
            exit 1
          fi
          COUNT="$(grep -c '^access-tokens' "$CONF")"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly one access-tokens line, got $COUNT"
            exit 1
          fi
          echo "PASS"
