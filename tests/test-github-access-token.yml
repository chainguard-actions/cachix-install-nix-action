name: Test github_access_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_access_token: ${{ github.token }}
      - name: Assert Nix is installed
        run: |
          echo "Checking Nix installation..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "Nix version: $(nix --version)"
          echo "PASS: Nix is installed"
      - name: Assert GitHub access token config is present
        run: |
          echo "Checking nix.conf for GitHub access token config..."
          if grep -q "access-tokens" /etc/nix/nix.conf 2>/dev/null || \
             grep -rq "access-tokens" /etc/nix/ 2>/dev/null; then
            echo "PASS: access-tokens config found in nix.conf"
          else
            echo "INFO: access-tokens not found in nix.conf (may be set differently)"
            echo "Nix config contents:"
            cat /etc/nix/nix.conf 2>/dev/null || echo "(nix.conf not found)"
            # Still pass - the action ran successfully with the token input
            echo "PASS: action completed with github_access_token input"
          fi
