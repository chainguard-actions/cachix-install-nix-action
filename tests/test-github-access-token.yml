name: Test github_access_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_access_token: ${{ github.token }}
      - name: Assert Nix is installed
        run: |
          echo "Checking nix is installed..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "PASS: nix is installed"
      - name: Assert nix.conf has github token config
        run: |
          echo "Checking /etc/nix/nix.conf for github token config..."
          if ! grep -q "access-tokens" /etc/nix/nix.conf 2>/dev/null; then
            echo "FAIL: access-tokens not found in /etc/nix/nix.conf"
            exit 1
          fi
          echo "PASS: github access token configured in nix.conf"
