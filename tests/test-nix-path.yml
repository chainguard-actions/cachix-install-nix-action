name: Test Nix installation with nix_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix with nix_path
        id: install-nix
        uses: .
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix binary not found on PATH"
            exit 1
          fi
          echo "PASS: nix found at $(command -v nix)"

      - name: Assert NIX_PATH is set
        env:
          NIX_PATH_VAL: ${{ env.NIX_PATH }}
        run: |
          echo "NIX_PATH: $NIX_PATH_VAL"
          if [ -z "$NIX_PATH_VAL" ]; then
            echo "FAIL: NIX_PATH env var was not set"
            exit 1
          fi
          if [ "$NIX_PATH_VAL" != "nixpkgs=channel:nixos-unstable" ]; then
            echo "FAIL: NIX_PATH expected 'nixpkgs=channel:nixos-unstable' but got '$NIX_PATH_VAL'"
            exit 1
          fi
          echo "PASS: NIX_PATH=$NIX_PATH_VAL"

      - name: Assert nix version runs
        run: |
          NIX_VERSION=$(nix --version)
          echo "nix version: $NIX_VERSION"
          if [ -z "$NIX_VERSION" ]; then
            echo "FAIL: nix --version returned empty output"
            exit 1
          fi
          echo "PASS: $NIX_VERSION"
