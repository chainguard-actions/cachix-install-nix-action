name: Test nix_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          rm -rf /tmp/fake-nix
          if ! command -v sudo >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
      - id: action
        uses: .
        with:
          install_url: file://${{ github.workspace }}/tests/fixtures/fake-install.sh
          enable_kvm: 'false'
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Assert NIX_PATH
        run: |
          echo "NIX_PATH=${NIX_PATH:-}"
          if [ "${NIX_PATH:-}" != "nixpkgs=channel:nixos-unstable" ]; then
            echo "FAIL: NIX_PATH not set correctly"; exit 1
          fi
          echo "PASS"
