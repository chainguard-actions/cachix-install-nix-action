name: Test failure on unreachable install_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          install_url: file://${{ github.workspace }}/tests/fixtures/does-not-exist.sh
          enable_kvm: false
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing installer"
            exit 1
          fi
          if command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix should not be installed"
            exit 1
          fi
          echo "PASS"
