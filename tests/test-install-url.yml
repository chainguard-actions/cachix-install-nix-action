name: Test install_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          install_url: https://nixos.org/nix/install
      - name: Assert Nix is installed
        run: |
          echo "Checking nix installation..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "PASS: nix is installed at $(command -v nix)"
      - name: Assert Nix works
        run: |
          echo "Running nix --version..."
          NIX_VERSION=$(nix --version 2>&1)
          echo "nix version: $NIX_VERSION"
          if [ -z "$NIX_VERSION" ]; then
            echo "FAIL: nix --version returned empty"
            exit 1
          fi
          echo "PASS: nix version output: $NIX_VERSION"
