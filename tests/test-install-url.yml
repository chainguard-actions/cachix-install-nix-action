name: Test install_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_url: "https://releases.nixos.org/nix/nix-2.24.9/install"
      - name: Assert Nix is installed
        run: |
          echo "Checking Nix installation from custom install_url..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found after install from custom URL"
            exit 1
          fi
          NIX_VERSION="$(nix --version)"
          echo "Nix version: $NIX_VERSION"
          echo "PASS: Nix is installed via custom install_url"
      - name: Assert Nix can evaluate a basic expression
        run: |
          echo "Testing basic Nix evaluation..."
          RESULT=$(nix-instantiate --eval -E '1 + 1' 2>/dev/null || echo "eval-failed")
          echo "Result: $RESULT"
          if [ "$RESULT" = "2" ]; then
            echo "PASS: Nix evaluation works"
          else
            echo "FAIL: Nix evaluation returned unexpected result: $RESULT"
            exit 1
          fi
