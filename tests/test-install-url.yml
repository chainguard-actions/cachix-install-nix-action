name: Test install_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_url: https://releases.nixos.org/nix/nix-2.18.1/install
      - name: Assert Nix is installed
        run: |
          echo "Checking nix is installed..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix command not found"
            exit 1
          fi
          echo "PASS: nix is installed via custom install_url"
      - name: Assert Nix version matches expected
        run: |
          NIX_VERSION=$(nix --version 2>&1 || true)
          echo "nix version: $NIX_VERSION"
          if echo "$NIX_VERSION" | grep -q "nix"; then
            echo "PASS: nix version output looks correct"
          else
            echo "FAIL: unexpected nix version output: $NIX_VERSION"
            exit 1
          fi
