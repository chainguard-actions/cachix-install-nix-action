name: Test Nix installation with set_as_trusted_user disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix (set_as_trusted_user=false)
        id: install-nix
        uses: .
        with:
          set_as_trusted_user: false

      - name: Assert nix is installed
        run: |
          echo "Checking nix binary..."
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix binary not found on PATH"
            exit 1
          fi
          echo "PASS: nix found at $(command -v nix)"

      - name: Assert nix version runs
        run: |
          NIX_VERSION=$(nix --version)
          echo "nix version: $NIX_VERSION"
          if [ -z "$NIX_VERSION" ]; then
            echo "FAIL: nix --version returned empty output"
            exit 1
          fi
          echo "PASS: $NIX_VERSION"

      - name: Assert nix store is accessible
        run: |
          echo "Checking /nix/store..."
          if [ ! -d /nix/store ]; then
            echo "FAIL: /nix/store directory does not exist"
            exit 1
          fi
          echo "PASS: /nix/store exists"

      - name: Assert nix show-config works
        run: |
          echo "Running nix show-config..."
          NIX_CONFIG=$(nix show-config 2>/dev/null || true)
          echo "nix config (excerpt):"
          echo "$NIX_CONFIG" | head -20
          # Verify nix is functional
          if [ -z "$NIX_CONFIG" ]; then
            echo "WARN: nix show-config returned empty output"
          else
            echo "PASS: nix show-config returned output"
          fi
