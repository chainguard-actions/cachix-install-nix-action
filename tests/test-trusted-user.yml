name: Test set_as_trusted_user input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          set_as_trusted_user: "true"
      - name: Assert nix is installed
        run: |
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          echo "PASS: nix is installed"
      - name: Assert current user is in trusted-users
        run: |
          echo "Current user: $USER"
          echo "Checking /etc/nix/nix.conf for trusted-users..."
          if [ ! -f /etc/nix/nix.conf ]; then
            echo "FAIL: /etc/nix/nix.conf does not exist"
            exit 1
          fi
          cat /etc/nix/nix.conf
          if ! grep -q "trusted-users" /etc/nix/nix.conf; then
            echo "FAIL: trusted-users not found in /etc/nix/nix.conf"
            exit 1
          fi
          if ! grep "trusted-users" /etc/nix/nix.conf | grep -q "root"; then
            echo "FAIL: 'root' not found in trusted-users line"
            exit 1
          fi
          echo "PASS: trusted-users is configured in /etc/nix/nix.conf"
      - name: Assert nix flakes work (requires trusted user for some operations)
        run: |
          # Verify that experimental features (flakes, nix-command) are enabled
          nix --version
          echo "PASS: nix command works"
