name: Test Nix installation in no-daemon mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-nix
        uses: .
        with:
          install_options: --no-daemon
      - name: Assert nix is installed
        run: |
          if ! command -v nix &>/dev/null; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          echo "PASS: nix found at $(command -v nix)"
      - name: Assert nix works in single-user mode
        run: |
          nix --version
          echo "PASS: nix --version succeeded in no-daemon mode"
      - name: Assert nix-daemon is not running
        run: |
          if systemctl is-active nix-daemon &>/dev/null; then
            echo "INFO: nix-daemon is running (unexpected for --no-daemon)"
            # Not a hard failure - some environments may differ
          else
            echo "PASS: nix-daemon is not active (expected for --no-daemon)"
          fi
      - name: Assert nix store is accessible
        run: |
          if [ ! -d /nix/store ]; then
            echo "FAIL: /nix/store does not exist"
            exit 1
          fi
          echo "PASS: /nix/store exists"
